name: Windows build
on:
  push:
    branches: [main, implementation]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare environment
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -r requirements-lock.txt
          ./scripts/prepare-tools.ps1
      - name: Tests and portable builds
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./scripts/build.ps1 -Both
      - name: Prepare public release bundle
        shell: pwsh
        run: |
          $version = (& .venv/Scripts/python.exe -c "from wallpaper_studio import __version__; print(__version__)").Trim()
          .venv/Scripts/python.exe scripts/release_bundle.py --version $version
      - uses: actions/upload-artifact@v4
        with:
          name: WallpaperStudio-win64
          path: |
            dist/v*/release/*
      - name: Frozen executable smoke
        shell: pwsh
        run: |
          $portable = (Get-ChildItem dist/v*/onedir/WallpaperStudio/WallpaperStudio.exe).FullName
          $single = (Get-ChildItem dist/v*/onefile/WallpaperStudio.exe).FullName
          $p = Start-Process -FilePath $portable -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Frozen GUI smoke failed' }
          $p = Start-Process -FilePath $single -ArgumentList '--diagnostics' -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Frozen dependency smoke failed' }
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WallpaperStudio-win64
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ github.ref_name }}" --draft --prerelease --generate-notes $(find release -type f)
